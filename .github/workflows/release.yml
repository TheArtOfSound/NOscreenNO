name: Release APK

# Publishes a signed release APK to a public GitHub Release, so anyone can grab it at
#   https://github.com/TheArtOfSound/NOscreenNO/releases/latest/download/NOscreenNO.apk
# Fires on a version tag (v*) or can be run manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set. Add the signing secrets before releasing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Stage APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then echo "::error::No signed release APK was produced."; exit 1; fi
          echo "Found signed APK: $APK"
          cp "$APK" NOscreenNO.apk

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES="**QEV Shield $VERSION** — keep everything private on Android.

          Install: download \`NOscreenNO.apk\` below on an Android 8.0+ phone, open it, and allow installing from your browser when prompted.

          - Local-only AES-256-GCM encryption for text & files
          - On-device encrypted vault
          - Screenshot-blocked secure window + visual privacy shield
          - No account, no server, no telemetry

          Website: https://theartofsound.github.io/NOscreenNO/"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists — updating the APK asset."
            gh release upload "$VERSION" NOscreenNO.apk --clobber
          else
            echo "Creating release $VERSION."
            gh release create "$VERSION" NOscreenNO.apk \
              --title "QEV Shield $VERSION" \
              --notes "$NOTES" \
              --latest
          fi
